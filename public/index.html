<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Remote Interactive Hub</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; }
        .card { background: #1e1e1e; max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #0056b3; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; text-align: center; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        .code-display { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #28a745; margin: 15px 0; }
        
        .video-container { position: relative; width: 100%; max-width: 480px; margin: 15px auto; background: #000; border-radius: 8px; border: 2px solid #333; overflow: hidden; }
        #remoteVideo { width: 100%; display: block; background: #000; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #ffc107; z-index: 10; }
        .hidden { display: none !important; }

        #paintCanvas { background: #ffffff; border-radius: 8px; touch-action: none; margin-top: 15px; cursor: crosshair; }
        .chat-box { background: #222; height: 130px; overflow-y: auto; text-align: left; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .status-text { font-size: 14px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>📱 Remote Camera & Interactive Hub</h2>

    <!-- Connection Setup -->
    <div id="setup-card" class="card">
        <h3>Connection Mode Select Korun</h3>
        <button onclick="startHost()">1. Ei phone Host (Camera Source)</button>
        <hr style="margin: 15px 0; border-color: #333;">
        <input type="number" id="joinCode" placeholder="Enter 6-Digit Code">
        <button onclick="joinRoom()">2. Second phone theke Join korun</button>
        <div id="statusMsg" class="status-text"></div>
    </div>

    <!-- Host Display Code -->
    <div id="host-card" class="card hidden">
        <h3>Aponar connection pin:</h3>
        <div class="code-display" id="generatedCode">------</div>
        <p>Second phone-e ei pin diye connect korun.</p>
        <div id="connectionStatus" class="status-text" style="color: #28a745; margin-top: 10px;">Waiting for viewer...</div>
    </div>

    <!-- Connected Workspace -->
    <div id="workspace" class="hidden">
        <div class="card">
            <h3>🎥 Live Camera & Remote Control</h3>
            <button id="camBtn" onclick="toggleCamera()">📷 Camera On Korun (Host)</button>
            
            <!-- Remote Camera Controls for Viewer -->
            <div id="remoteControls" class="hidden" style="margin-top: 10px;">
                <div class="btn-group">
                    <button onclick="sendCamCommand('switch')" style="background: #17a2b8;">🔄 Front/Back</button>
                    <button onclick="sendCamCommand('zoom-in')" style="background: #ffc107; color: #000;">🔍 Zoom +</button>
                    <button onclick="sendCamCommand('zoom-out')" style="background: #ffc107; color: #000;">🔍 Zoom -</button>
                </div>
                <div class="btn-group">
                    <button onclick="sendCamCommand('torch')" style="background: #6f42c1;">🔦 Flashlight</button>
                    <button onclick="captureSnapshot()" style="background: #28a745;">📸 Capture</button>
                </div>
                <button id="recBtn" onclick="toggleRecording()" style="background: #dc3545;">⏺️ Record Video</button>
            </div>

            <!-- Video Wrapper with Status Overlay -->
            <div id="videoWrapper" class="video-container hidden">
                <div id="videoOverlay" class="video-overlay">Camera Paused</div>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            
            <h4 style="margin-top: 15px;">🎨 Real-Time Drawing Canvas</h4>
            <canvas id="paintCanvas" width="320" height="240"></canvas>
            <button onclick="clearCanvas()" style="background: #6c757d;">Canvas Clear Korun</button>
        </div>

        <div class="card">
            <h3>💬 Message & Link Sync</h3>
            <div id="chatBox" class="chat-box"></div>
            <input type="text" id="chatInput" placeholder="Message likhun..." style="text-align: left;">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const socket = io();
        let peerConnection;
        let dataChannel;
        let localStream;
        let targetPeerId;
        let isHost = false;
        let useFrontCamera = false;
        let currentZoom = 1;
        let torchOn = false;
        let mediaRecorder;
        let recordedChunks = [];

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19002' }] };

        function startHost() {
            isHost = true;
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('host-card').classList.remove('hidden');
            socket.emit('create-room');
        }

        socket.on('room-created', ({ roomCode }) => {
            document.getElementById('generatedCode').innerText = roomCode;
        });

        function joinRoom() {
            const code = document.getElementById('joinCode').value;
            if (!code) {
                document.getElementById('statusMsg').innerText = "Pin code din!";
                return;
            }
            socket.emit('join-room', { roomCode: code });
        }

        socket.on('room-joined', ({ hostId }) => {
            targetPeerId = hostId;
            initWorkspace();
            setupPeerConnection(hostId, false);
        });

        socket.on('viewer-joined', ({ viewerId }) => {
            targetPeerId = viewerId;
            document.getElementById('connectionStatus').innerText = "Viewer connected successfully!";
            initWorkspace();
            setupPeerConnection(viewerId, true);
        });

        function initWorkspace() {
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('host-card').classList.add('hidden');
            document.getElementById('workspace').classList.remove('hidden');
            
            document.getElementById('videoWrapper').classList.remove('hidden');
            document.getElementById('videoOverlay').innerText = "Waiting for camera...";

            if (!isHost) {
                document.getElementById('camBtn').style.display = 'none';
                document.getElementById('remoteControls').classList.remove('hidden');
            }
            initCanvas();
        }

        function createPeerConnection(targetId) {
            if (peerConnection) return peerConnection;
            peerConnection = new RTCPeerConnection(configuration);

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { to: targetId, signal: { candidate: e.candidate } });
            };

            peerConnection.ontrack = (e) => {
                const videoElem = document.getElementById('remoteVideo');
                videoElem.srcObject = e.streams[0];
                document.getElementById('videoOverlay').classList.add('hidden');

                e.streams[0].getVideoTracks()[0].onmute = () => {
                    document.getElementById('videoOverlay').innerText = "Camera Paused";
                    document.getElementById('videoOverlay').classList.remove('hidden');
                };
                e.streams[0].getVideoTracks()[0].onunmute = () => {
                    document.getElementById('videoOverlay').classList.add('hidden');
                };
            };

            return peerConnection;
        }

        function setupPeerConnection(targetId, isInitiator) {
            const pc = createPeerConnection(targetId);

            if (isInitiator) {
                dataChannel = pc.createDataChannel("hubData");
                bindDataChannelEvents();
                createAndSendOffer(targetId);
            } else {
                pc.ondatachannel = (e) => {
                    dataChannel = e.channel;
                    bindDataChannelEvents();
                };
            }
        }

        async function createAndSendOffer(targetId) {
            const pc = createPeerConnection(targetId);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('signal', { to: targetId, signal: { sdp: offer } });
        }

        socket.on('signal', async ({ from, signal }) => {
            targetPeerId = from;
            const pc = createPeerConnection(from);

            if (signal.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                if (signal.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { to: from, signal: { sdp: answer } });
                }
            } else if (signal.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        });

        socket.on('peer-disconnected', () => {
            handleHostLeft();
        });

        function handleHostLeft() {
            const overlay = document.getElementById('videoOverlay');
            overlay.innerText = "Host Left";
            overlay.classList.remove('hidden');
            const videoElem = document.getElementById('remoteVideo');
            if (videoElem.srcObject) {
                videoElem.srcObject.getTracks().forEach(t => t.stop());
                videoElem.srcObject = null;
            }
        }

        async function toggleCamera() {
            try {
                if (!targetPeerId) return;
                const pc = createPeerConnection(targetPeerId);

                if (!localStream) {
                    const constraints = {
                        video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                        audio: true
                    };
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                    
                    await createAndSendOffer(targetPeerId);
                    document.getElementById('camBtn').innerText = "📷 Camera On Achhe";
                    document.getElementById('camBtn').style.background = "#28a745";
                } else {
                    const videoTrack = localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        videoTrack.enabled = !videoTrack.enabled;
                        if (videoTrack.enabled) {
                            document.getElementById('camBtn').innerText = "📷 Camera On Achhe";
                            document.getElementById('camBtn').style.background = "#28a745";
                            if (dataChannel && dataChannel.readyState === 'open') {
                                dataChannel.send(JSON.stringify({ type: 'cam-status', status: 'resumed' }));
                            }
                        } else {
                            document.getElementById('camBtn').innerText = "📷 Camera Paused";
                            document.getElementById('camBtn').style.background = "#ffc107";
                            document.getElementById('camBtn').style.color = "#000";
                            if (dataChannel && dataChannel.readyState === 'open') {
                                dataChannel.send(JSON.stringify({ type: 'cam-status', status: 'paused' }));
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        async function handleCameraCommand(action) {
            if (!peerConnection) return;

            if (action === 'switch') {
                useFrontCamera = !useFrontCamera;
                try {
                    if (localStream) {
                        localStream.getTracks().forEach(track => track.stop());
                    }
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                        audio: true
                    });
                    const newVideoTrack = localStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        await sender.replaceTrack(newVideoTrack);
                    }
                } catch (e) {
                    console.error("Switch error:", e);
                }
            } else if (action === 'zoom-in' || action === 'zoom-out') {
                if (!localStream) return;
                const videoTrack = localStream.getVideoTracks()[0];
                if (!videoTrack) return;
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.zoom) {
                    currentZoom = action === 'zoom-in' ? Math.min(currentZoom + 0.5, capabilities.zoom.max) : Math.max(currentZoom - 0.5, capabilities.zoom.min);
                    videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] });
                }
            } else if (action === 'torch') {
                if (!localStream) return;
                const videoTrack = localStream.getVideoTracks()[0];
                if (!videoTrack) return;
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.torch) {
                    torchOn = !torchOn;
                    videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
                }
            }
        }

        function sendCamCommand(action) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'cam-cmd', action }));
            }
        }

        function captureSnapshot() {
            const video = document.getElementById('remoteVideo');
            if (!video.srcObject) return;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const link = document.createElement('a');
            link.download = 'snapshot.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toggleRecording() {
            const video = document.getElementById('remoteVideo');
            const btn = document.getElementById('recBtn');
            if (!video.srcObject) return;

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(video.srcObject);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'recorded-stream.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                };
                mediaRecorder.start();
                btn.innerText = "⏹️ Stop Record";
                btn.style.background = "#ffc107";
                btn.style.color = "#000";
            } else {
                mediaRecorder.stop();
                btn.innerText = "⏺️ Record Video";
                btn.style.background = "#dc3545";
                btn.style.color = "#fff";
            }
        }

        function bindDataChannelEvents() {
            if (!dataChannel) return;
            dataChannel.onmessage = (e) => {
                const packet = JSON.parse(e.data);
                if (packet.type === 'draw') drawOnCanvas(packet.x, packet.y, packet.isDrawing);
                if (packet.type === 'clear') clearCanvasLocal();
                if (packet.type === 'chat') appendMessage("Remote", packet.text);
                if (packet.type === 'cam-cmd') handleCameraCommand(packet.action);
                if (packet.type === 'cam-status') {
                    const overlay = document.getElementById('videoOverlay');
                    if (packet.status === 'paused') {
                        overlay.innerText = "Camera Paused";
                        overlay.classList.remove('hidden');
                    } else {
                        overlay.classList.add('hidden');
                    }
                }
            };
        }

        let canvas, ctx, drawing = false;
        function initCanvas() {
            canvas = document.getElementById('paintCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            const startDraw = (e) => { drawing = true; draw(e); };
            const stopDraw = () => { drawing = false; ctx.beginPath(); sendDraw(0, 0, false); };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mousemove', draw);

            canvas.addEventListener('touchstart', (e) => { startDraw(e.touches[0]); e.preventDefault(); });
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });
        }

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            drawOnCanvas(x, y, true);
            sendDraw(x, y, true);
        }

        function drawOnCanvas(x, y, isDrawing) {
            if (!isDrawing) { ctx.beginPath(); return; }
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#007bff';

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function sendDraw(x, y, isDrawing) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'draw', x, y, isDrawing }));
            }
        }

        function clearCanvas() {
            clearCanvasLocal();
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'clear' }));
            }
        }

        function clearCanvasLocal() {
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage("You", text);
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'chat', text }));
            }
            input.value = '';
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
