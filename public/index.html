<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Camera Security Hub</title>
    <script src="/socket.io/socket.io.js"></script>
    <!-- TensorFlow.js and COCO-SSD Human Detection Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; }
        .card { background: #1e1e1e; max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #0056b3; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; text-align: center; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        .code-display { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #28a745; margin: 15px 0; }
        
        /* Multi-Camera Grid Container */
        .camera-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .video-box { position: relative; background: #000; border-radius: 8px; border: 2px solid #444; overflow: hidden; }
        .video-box video { width: 100%; display: block; background: #000; }
        .cam-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #28a745; padding: 4px 8px; font-size: 12px; font-weight: bold; border-radius: 4px; z-index: 15; }
        
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; color: #ffc107; z-index: 10; pointer-events: none; text-align: center; padding: 10px; }
        
        .stealth-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; letter-spacing: 2px; z-index: 999999;
        }

        .motion-alert-banner {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(220, 53, 69, 0.95); color: #fff; padding: 12px 25px; border-radius: 8px;
            font-size: 16px; font-weight: bold; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            animation: fadeInOut 4s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; display: none; }
        }

        .hidden { display: none !important; }
        .status-text { font-size: 14px; color: #aaa; margin-top: 5px; }
        .qr-box { background: #fff; padding: 10px; display: inline-block; border-radius: 8px; margin-top: 10px; }
        .qr-box img { display: block; width: 180px; height: 180px; }
    </style>
</head>
<body>

    <div id="stealthOverlay" class="stealth-screen hidden">Parvez is watching</div>
    <div id="motionAlertContainer"></div>

    <h2>📱 AI Multi-Camera Security Hub</h2>

    <!-- Connection Setup -->
    <div id="setup-card" class="card">
        <h3>Connection Mode Select Korun</h3>
        <button onclick="startController()" style="background: #28a745;">1. Controller Phone (Generate PIN & QR)</button>
        <hr style="margin: 15px 0; border-color: #333;">
        <input type="number" id="joinCode" placeholder="Enter 6-Digit Code">
        <button onclick="joinAsCamera()">2. Camera Host Phone (Join Room)</button>
        <div id="statusMsg" class="status-text"></div>
    </div>

    <!-- Controller Display Code & QR -->
    <div id="controller-card" class="card hidden">
        <h3>Aponar Connection PIN:</h3>
        <div class="code-display" id="generatedCode">------</div>
        <p>Multiple Camera phone theke nicher QR scan korun ba PIN diye join করুন:</p>
        <div class="qr-box">
            <img id="qrImage" alt="QR Code">
        </div>
        <div id="connectionStatus" class="status-text" style="color: #28a745; margin-top: 10px;">Waiting for Camera phones to connect...</div>
    </div>

    <!-- Connected Workspace -->
    <div id="workspace" class="hidden">
        <div class="card">
            <h3>🎥 Live Cameras Grid</h3>
            <div id="cameraStatusMsg" class="status-text hidden" style="color: #28a745; margin-bottom: 10px;">Camera Connected & Ready</div>
            
            <!-- Controls for Controller -->
            <div id="remoteControls" class="hidden" style="margin-top: 10px;">
                <button onclick="sendBroadcastCommand('toggle-camera')" style="background: #28a745;">📷 Camera On/Off (All)</button>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="sendBroadcastCommand('switch')" style="background: #17a2b8;">🔄 Front/Back</button>
                    <button onclick="sendBroadcastCommand('alarm')" style="background: #dc3545;">🚨 Siren Alarm</button>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="sendBroadcastCommand('speak-warning')" style="background: #e83e8c;">🗣️ Warning Voice</button>
                    <button id="stealthBtn" onclick="toggleStealthScreen()" style="background: #6f42c1;">🕶️ Stealth Screen</button>
                </div>
                <button id="aiBtn" onclick="toggleAiDetection()" style="background: #fd7e14; margin-top: 10px;">🤖 AI Human Detection: OFF</button>
                <button onclick="captureAndSaveSnapshot()" style="background: #17a2b8; margin-top: 10px;">📥 Save Snapshot</button>
            </div>

            <!-- Cameras Grid Container -->
            <div id="cameraGrid" class="camera-grid hidden"></div>
            
            <!-- Hidden elements for camera host AI processing -->
            <video id="localPreview" autoplay playsinline muted style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></video>
        </div>
    </div>
    <script>
        const socket = io();
        let peerConnections = {}; // cameraId -> RTCPeerConnection
        let dataChannels = {};    // cameraId -> RTCDataChannel
        let localStream;
        let isController = false;
        let useFrontCamera = false;
        let aiDetectionActive = false;
        let aiModel = null;
        let aiCheckInterval = null;
        let lastAiTrigger = 0;
        let memoryCamVideo = null;
        let stealthActive = false;

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19002' }] };

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('joinCode').value = roomParam;
                window.history.replaceState({}, document.title, window.location.pathname);
                setTimeout(() => { joinAsCamera(); }, 400);
            }
        };

        function startController() {
            isController = true;
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('controller-card').classList.remove('hidden');
            socket.emit('create-room');
        }

        socket.on('room-created', ({ roomCode }) => {
            document.getElementById('generatedCode').innerText = roomCode;
            const joinUrl = `${window.location.origin}/?room=${roomCode}`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(joinUrl)}`;
            document.getElementById('qrImage').src = qrApiUrl;
        });

        async function joinAsCamera() {
            const code = document.getElementById('joinCode').value;
            if (!code) {
                document.getElementById('statusMsg').innerText = "Pin code din ba QR scan korun!";
                return;
            }
            initWorkspace(false);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                });
                const localPreview = document.getElementById('localPreview');
                localPreview.srcObject = localStream;
                localPreview.play().catch(e => console.log(e));
                getMemoryCamVideo();
            } catch (err) {
                console.error("Camera permission error:", err);
                alert("Camera & Microphone permission zaroori!");
            }

            socket.emit('join-room', { roomCode: code });
        }

        socket.on('room-joined', ({ hostId }) => {
            setupPeerConnection(hostId, false);
        });

        // Controller receives notification when a camera joins
        socket.on('camera-joined', ({ cameraId }) => {
            document.getElementById('connectionStatus').innerText = `Camera connected! (${cameraId.substring(0,5)})`;
            initWorkspace(true);
            setupPeerConnection(cameraId, true);
        });

        socket.on('camera-left', ({ cameraId }) => {
            removeCameraVideo(cameraId);
        });

        function initWorkspace(isUserControlling) {
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('controller-card').classList.add('hidden');
            document.getElementById('workspace').classList.remove('hidden');
            document.getElementById('cameraGrid').classList.remove('hidden');

            if (isUserControlling) {
                document.getElementById('remoteControls').classList.remove('hidden');
            } else {
                document.getElementById('cameraStatusMsg').classList.remove('hidden');
            }
        }

        function setupPeerConnection(targetId, isInitiator) {
            const pc = new RTCPeerConnection(configuration);
            peerConnections[targetId] = pc;

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { to: targetId, signal: { candidate: e.candidate } });
            };

            if (isController) {
                // Controller creates data channel to send commands to camera
                const dc = pc.createDataChannel("hubData");
                dataChannels[targetId] = dc;
                bindDataChannelEvents(dc, targetId);

                pc.ontrack = (e) => {
                    addCameraVideo(targetId, e.streams[0]);
                };

                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    socket.emit('signal', { to: targetId, signal: { sdp: pc.localDescription } });
                });
            } else {
                // Camera side receives data channel
                pc.ondatachannel = (e) => {
                    dataChannels[targetId] = e.channel;
                    bindDataChannelEvents(e.channel, targetId);
                };

                if (localStream) {
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                }
            }
        }

        socket.on('signal', async ({ from, signal }) => {
            let pc = peerConnections[from];
            if (!pc) {
                pc = new RTCPeerConnection(configuration);
                peerConnections[from] = pc;
                pc.onicecandidate = (e) => {
                    if (e.candidate) socket.emit('signal', { to: from, signal: { candidate: e.candidate } });
                };
                pc.ontrack = (e) => {
                    addCameraVideo(from, e.streams[0]);
                };
                pc.ondatachannel = (e) => {
                    dataChannels[from] = e.channel;
                    bindDataChannelEvents(e.channel, from);
                };
            }

            if (signal.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                if (signal.sdp.type === 'offer') {
                    if (localStream) {
                        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                    }
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { to: from, signal: { sdp: answer } });
                }
            } else if (signal.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        });

        function addCameraVideo(id, stream) {
            const grid = document.getElementById('cameraGrid');
            let box = document.getElementById(`box-${id}`);
            if (!box) {
                box = document.createElement('div');
                box.id = `box-${id}`;
                box.className = 'video-box';
                box.innerHTML = `
                    <div class="cam-label">CAM: ${id.substring(0,5)}</div>
                    <div class="video-overlay" id="overlay-${id}">You are being monitored</div>
                    <video id="vid-${id}" autoplay playsinline></video>
                `;
                grid.appendChild(box);
            }
            const videoElem = document.getElementById(`vid-${id}`);
            videoElem.srcObject = stream;
            document.getElementById(`overlay-${id}`).classList.add('hidden');
        }

        function removeCameraVideo(id) {
            const box = document.getElementById(`box-${id}`);
            if (box) box.remove();
            delete peerConnections[id];
            delete dataChannels[id];
        }

        function getMemoryCamVideo() {
            if (!memoryCamVideo) {
                memoryCamVideo = document.createElement('video');
                memoryCamVideo.autoplay = true;
                memoryCamVideo.playsInline = true;
                memoryCamVideo.muted = true;
            }
            if (localStream && memoryCamVideo.srcObject !== localStream) {
                memoryCamVideo.srcObject = localStream;
                memoryCamVideo.play().catch(e => console.log(e));
            }
            return memoryCamVideo;
        }

        // AI Human Detection Runner using COCO-SSD Model on Camera Phone
        async function toggleAiDetection() {
            aiDetectionActive = !aiDetectionActive;
            const btn = document.getElementById('aiBtn');
            
            if (aiDetectionActive) {
                btn.innerText = "🤖 AI Human Detection: LOADING...";
                showMotionNotification("🤖 Loading AI Model...");
                
                if (!aiModel) {
                    try {
                        aiModel = await cocoSsd.load();
                    } catch (e) {
                        console.error("AI Load error:", e);
                        aiDetectionActive = false;
                        btn.innerText = "🤖 AI Human Detection: OFF";
                        return;
                    }
                }

                btn.innerText = "🤖 AI Human Detection: ON";
                btn.style.background = "#28a745";
                showMotionNotification("🤖 AI Human Detection Active!");

                aiCheckInterval = setInterval(async () => {
                    if (!localStream || !localStream.active || !aiModel) return;
                    const memVideo = getMemoryCamVideo();
                    if (memVideo.readyState < memVideo.HAVE_ENOUGH_DATA) return;

                    try {
                        const predictions = await aiModel.detect(memVideo);
                        // Check if any detected object is a 'person' with score > 0.65
                        const humanFound = predictions.find(p => p.class === 'person' && p.score > 0.65);
                        
                        const now = Date.now();
                        if (humanFound && (now - lastAiTrigger > 7000)) {
                            lastAiTrigger = now;
                            captureAndSendHumanSnapshot();
                        }
                    } catch (err) {
                        console.error("AI Detection error:", err);
                    }
                }, 1500); // Check every 1.5 seconds

            } else {
                btn.innerText = "🤖 AI Human Detection: OFF";
                btn.style.background = "#fd7e14";
                clearInterval(aiCheckInterval);
            }
        }

        function captureAndSendHumanSnapshot() {
            const memVideo = getMemoryCamVideo();
            if (!memVideo.srcObject) return;
            const canvas = document.createElement('canvas');
            canvas.width = memVideo.videoWidth || 640;
            canvas.height = memVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(memVideo, 0, 0, canvas.width, canvas.height);
            const imgData = canvas.toDataURL('image/png');

            // Send to controller via all active data channels
            for (let id in dataChannels) {
                const dc = dataChannels[id];
                if (dc && dc.readyState === 'open') {
                    dc.send(JSON.stringify({ type: 'human-detected-snapshot', image: imgData }));
                }
            }
        }

        function sendBroadcastCommand(action) {
            for (let id in dataChannels) {
                const dc = dataChannels[id];
                if (dc && dc.readyState === 'open') {
                    dc.send(JSON.stringify({ type: 'cam-cmd', action }));
                }
            }
        }

        function toggleStealthScreen() {
            stealthActive = !stealthActive;
            sendBroadcastCommand(stealthActive ? 'stealth-on' : 'stealth-off');
            const btn = document.getElementById('stealthBtn');
            if (stealthActive) {
                btn.innerText = "🕶️ Stealth: ON";
                btn.style.background = "#dc3545";
            } else {
                btn.innerText = "🕶️ Stealth Screen";
                btn.style.background = "#6f42c1";
            }
        }

        function showMotionNotification(msg) {
            const container = document.getElementById('motionAlertContainer');
            const banner = document.createElement('div');
            banner.className = 'motion-alert-banner';
            banner.innerText = msg;
            container.appendChild(banner);
            setTimeout(() => { banner.remove(); }, 4000);
        }

        function captureAndSaveSnapshot() {
            const videos = document.querySelectorAll('.video-box video');
            if (videos.length === 0) {
                showMotionNotification("⚠️ No camera stream active!");
                return;
            }
            videos.forEach((video, index) => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const link = document.createElement('a');
                link.download = `snapshot-cam-${index+1}-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
            showMotionNotification("📥 Snapshots saved to gallery!");
        }

        function bindDataChannelEvents(dc, targetId) {
            dc.onmessage = (e) => {
                const packet = JSON.parse(e.data);
                
                // Controller receives human detection alert & snapshot from camera
                if (packet.type === 'human-detected-snapshot') {
                    saveImageToControllerGallery(packet.image, `human-detected-${targetId.substring(0,4)}`);
                    showMotionNotification("⚠️ Human Detected! Snapshot saved to gallery.");
                }

                // Camera receives commands from controller
                if (packet.type === 'cam-cmd') {
                    handleCameraCommand(packet.action);
                }
                if (packet.type === 'stealth-on') {
                    document.getElementById('stealthOverlay').classList.remove('hidden');
                }
                if (packet.type === 'stealth-off') {
                    document.getElementById('stealthOverlay').classList.add('hidden');
                }
            };
        }

        function saveImageToControllerGallery(base64Data, filenamePrefix) {
            const link = document.createElement('a');
            link.download = `${filenamePrefix}-${Date.now()}.png`;
            link.href = base64Data;
            link.click();
        }

        function playSiren() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.5);
            } catch (e) { console.error("Audio error", e); }
        }

        function speakWarningVoice() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance("Don't close your browser");
                    utterance.rate = 1.0;
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) { console.error("Speech error", e); }
        }

        async function handleCameraCommand(action) {
            if (action === 'alarm') { playSiren(); return; }
            if (action === 'speak-warning') { speakWarningVoice(); return; }
            if (action === 'toggle-motion') { toggleAiDetection(); return; }

            if (!localStream) return;
            if (action === 'switch') {
                useFrontCamera = !useFrontCamera;
                try {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                        audio: true
                    });
                    const localPreview = document.getElementById('localPreview');
                    localPreview.srcObject = localStream;
                    localPreview.play().catch(e => console.log(e));
                    getMemoryCamVideo();

                    const newVideoTrack = localStream.getVideoTracks()[0];
                    for (let id in peerConnections) {
                        const pc = peerConnections[id];
                        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(newVideoTrack);
                    }
                } catch (e) { console.error("Switch error:", e); }
            }
        }
    </script>
</body>
</html>
